<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoneVault – Quản lý kho đá (Firebase)</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b2030;--mu:#667086;--ln:#e3e6ee;--ac:#4338ca;--ok:#15935f;--wr:#c98a00;--er:#d6334a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2e;--tx:#e8eaf3;--mu:#98a0b8;--ln:#2a3050;--ac:#8b85ff}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--tx:#e8eaf3;--mu:#98a0b8;--ln:#2a3050;--ac:#8b85ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:17px}header .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav button{white-space:nowrap}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 11px}
button{cursor:pointer;font-weight:600}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--er)}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.c small{color:var(--mu)}.c h2{margin:2px 0 0;font-size:20px}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:block;font-size:12px;color:var(--mu)}label input,label select{width:100%;margin-top:3px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.t{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ln)}
.t.ok{color:var(--ok)}.t.wr{color:var(--wr)}.t.er{color:var(--er)}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;padding:16px}
#lock .c{width:min(380px,100%)}#lock input{width:100%;margin:8px 0}
.mu{color:var(--mu);font-size:12px}
#q{display:none}textarea{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px}
@media print{body>*:not(#q){display:none!important}#q{display:block;color:#000;background:#fff;padding:24px}}
</style></head><body>
<div id="lock"><div class="c" style="width:min(420px,100%);max-height:94vh;overflow:auto"><h2 style="margin:0">🪨 StoneVault</h2><p class="mu" id="lm"></p>
<div id="cfgf" style="display:none"><label>Dán firebaseConfig (Project settings → Your apps → Web)<textarea id="fc" rows="8" style="width:100%"></textarea></label><p><button class="p" onclick="saveFb()">Lưu cấu hình vào app</button></p></div>
<div id="lf" style="display:none"><label>Email<input id="l_e" type="email" autocomplete="username"></label><label>Mật khẩu<input id="l_p" type="password" autocomplete="current-password"></label><p><button class="p" onclick="login()">Đăng nhập</button> <button onclick="setupAdmin()">Tạo Admin đầu tiên</button></p><p><a href="#" onclick="resetFb();return false">Đổi cấu hình Firebase</a></p></div><p class="mu" id="le" style="color:var(--er)"></p></div></div>
<header><b>🪨 StoneVault</b><span class="mu">Firebase</span><span class="sp"></span><span class="mu" id="who"></span><span class="mu" id="cd"></span><button onclick="lockNow()">🔒 Đăng xuất</button></header>
<nav id="nv"></nav><main id="m"></main><div id="q"></div>
<script type="module">
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const [A,AU,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
const $=s=>document.querySelector(s),g$=i=>$('#'+i).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+' ₫',m2=n=>(+n||0).toFixed(2)+' m²';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const STEPS=['Mới tạo','Đã duyệt','Đang gia công','Vận chuyển','Thi công','Hoàn tất'],SCRAP=0.3;
const PERM={admin:['kho','nhap','ban','don','nhatky','qt','cf'],manager:['kho','nhap','ban','don','nhatky'],staff:['kho','ban','don']};
let cfg=null,app,auth,db,me=null,tab='kho',q='',idle=0,un=[],setting=false,D={slabs:[],orders:[],audit:[],users:[]};
const col=n=>F.collection(db,n),dc=(n,i)=>F.doc(db,n,i);
const err=t=>$('#le').textContent=t||'';
/* ---- cấu hình Firebase lưu trong app ---- */
function parseCfg(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw 0;let x=t.slice(a,b+1).replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');const o=JSON.parse(x);if(!o.apiKey||!o.projectId)throw 0;return o}
function saveFb(){try{cfg=parseCfg($('#fc').value);ls.set('sv_fb',JSON.stringify(cfg));boot()}catch(e){err('Cấu hình không hợp lệ (cần apiKey, projectId…).')}}
function resetFb(){if(confirm('Xóa cấu hình Firebase khỏi app?')){ls.del('sv_fb');lockNow(true);cfg=null;boot()}}
function boot(){err();$('#cfgf').style.display=cfg?'none':'block';$('#lf').style.display=cfg?'block':'none';$('#lm').textContent=cfg?'Đăng nhập bằng tài khoản được Admin cấp. Lần đầu: bấm “Tạo Admin đầu tiên”.':'Lần đầu: dán cấu hình Firebase của bạn. Cấu hình được lưu trong app, không phải nhập lại.';
if(cfg&&!app){app=A.initializeApp(cfg);auth=AU.getAuth(app);db=F.getFirestore(app);AU.onAuthStateChanged(auth,onAuth)}}
/* ---- xác thực ---- */
async function login(){err();try{await AU.signInWithEmailAndPassword(auth,g$('l_e'),$('#l_p').value)}catch(e){err('Đăng nhập thất bại: '+(e.code||e.message))}}
async function setupAdmin(){err();const p=$('#l_p').value,e=g$('l_e');if(!e||p.length<10)return err('Cần email và mật khẩu ≥ 10 ký tự.');setting=true;
try{const c=await AU.createUserWithEmailAndPassword(auth,e,p),b=F.writeBatch(db);b.set(dc('users',c.user.uid),{email:e,role:'admin'});b.set(dc('settings','bootstrap'),{by:c.user.uid,at:F.serverTimestamp()});await b.commit();setting=false;await onAuth(c.user)}
catch(x){setting=false;if(auth.currentUser)await AU.deleteUser(auth.currentUser).catch(()=>AU.signOut(auth));err('Không tạo được Admin (đã có Admin hoặc chưa dán Rules): '+(x.code||x.message))}}
async function onAuth(u){if(setting)return;un.forEach(f=>f());un=[];me=null;if(!u){$('#lock').style.display='grid';$('#m').innerHTML='';return}
try{const d=await F.getDoc(dc('users',u.uid));if(!d.exists()||!PERM[d.data().role])throw 0;me={uid:u.uid,...d.data()}}catch(e){await AU.signOut(auth);err('Tài khoản chưa được cấp quyền hoặc chưa dán Firestore Rules.');return}
$('#lock').style.display='none';$('#l_p').value='';idle=Date.now();tab='kho';listen();render();log('ĐĂNG NHẬP','')}
function lockNow(skip){if(auth&&!skip)AU.signOut(auth);else{$('#lock').style.display='grid';$('#m').innerHTML=''}}
setInterval(()=>{if(!me)return;const r=300000-(Date.now()-idle);$('#cd').textContent='Tự khóa '+Math.max(0,Math.ceil(r/1000))+'s';if(r<=0)lockNow()},1000);
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>idle=Date.now()));
/* ---- dữ liệu thời gian thực ---- */
function listen(){const L=(n,k,qr)=>un.push(F.onSnapshot(qr||col(n),s=>{D[k]=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>err(n+': '+e.code)));L('slabs','slabs');L('orders','orders');
if(me.role!='staff')L('audit','audit',F.query(col('audit'),F.orderBy('t','desc'),F.limit(200)));if(me.role=='admin')L('users','users')}
const log=(a,d)=>F.addDoc(col('audit'),{t:F.serverTimestamp(),uid:me.uid,u:me.email,a,d}).catch(()=>{});
const can=t=>me&&PERM[me.role].includes(t);
const TABS={kho:'📦 Kho',nhap:'➕ Nhập tấm',ban:'🧾 Báo giá/Bán',don:'🚚 Đơn hàng',nhatky:'🛡️ Nhật ký',qt:'👑 Quản trị',cf:'⚙️ Firebase & Rules'};
function render(){if(!me)return;$('#who').textContent=me.email+' · '+me.role;$('#nv').innerHTML=PERM[me.role].map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TABS[k]}</button>`).join('');$('#m').innerHTML=can(tab)?W[tab]():''}
const status=s=>s.rem<=0.0001?['Hết','er']:s.rem>=s.area-0.0001?['Nguyên tấm','ok']:s.rem<SCRAP?['Dư/phế liệu','wr']:['Đã cắt','wr'];
const debt=o=>o.total-(o.paid||[]).reduce((a,b)=>a+b,0);
const RULES=`rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function ok(){return request.auth!=null && exists(/databases/$(database)/documents/users/$(request.auth.uid));}
  function role(){return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role;}
  function boot(){return !exists(/databases/$(database)/documents/settings/bootstrap);}
  match /users/{u} {
   allow read: if request.auth!=null && (request.auth.uid==u || (ok() && role()=='admin'));
   allow create: if request.auth!=null && ((ok() && role()=='admin') || (request.auth.uid==u && request.resource.data.role=='admin' && boot()));
   allow update, delete: if ok() && role()=='admin';
  }
  match /settings/bootstrap {
   allow read: if request.auth!=null;
   allow create: if request.auth!=null && boot();
  }
  match /slabs/{id} {
   allow read: if ok();
   allow create: if ok() && role() in ['admin','manager'];
   allow update: if ok() && (role() in ['admin','manager'] || request.resource.data.diff(resource.data).affectedKeys().hasOnly(['rem']));
   allow delete: if ok() && role()=='admin';
  }
  match /orders/{id} {
   allow read, create: if ok();
   allow update: if ok() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['step','paid']);
   allow delete: if ok() && role()=='admin';
  }
  match /audit/{id} {
   allow read: if ok() && role() in ['admin','manager'];
   allow create: if ok() && request.resource.data.uid==request.auth.uid;
   allow update, delete: if false;
  }
 }
}`;
const W={
kho(){const S=D.slabs,l=S.filter(s=>(s.id+s.lot+s.type).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.id>b.id?1:-1),tv=S.reduce((a,s)=>a+s.rem*s.cost,0),td=D.orders.reduce((a,o)=>a+debt(o),0);
return`<div class="g"><div class="c"><small>Số tấm</small><h2>${S.length}</h2></div><div class="c"><small>Diện tích tồn</small><h2>${m2(S.reduce((a,s)=>a+s.rem,0))}</h2></div><div class="c"><small>Giá trị tồn</small><h2>${me.role=='staff'?'—':vnd(tv)}</h2></div><div class="c"><small>Công nợ</small><h2>${vnd(td)}</h2></div></div>
<p><input placeholder="Tìm mã tấm / lô / loại đá…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{render();const i=$('#m input');i.focus();i.setSelectionRange(99,99)},300)"></p>
<div class="c w"><table><tr><th>Mã tấm</th><th>Lô</th><th>Loại đá</th><th>D×R×Dày</th><th>Còn lại</th><th>Trạng thái</th></tr>${l.map(s=>{const t=status(s);return`<tr><td><b>${esc(s.id)}</b></td><td>${esc(s.lot)}</td><td>${esc(s.type)}</td><td>${s.l}×${s.w}m × ${s.th}cm</td><td>${m2(s.rem)} / ${m2(s.area)}</td><td><span class="t ${t[1]}">${t[0]}</span></td></tr>`}).join('')||'<tr><td colspan=6 class="mu">Chưa có tấm đá.</td></tr>'}</table></div>`},
nhap(){return`<div class="c"><h3 style="margin-top:0">Nhập lô đá</h3><div class="f"><label>Mã lô<input id="a1" placeholder="LO-2610"></label><label>Loại đá / vân<input id="a2"></label><label>Số tấm<input id="a3" type="number" value="5"></label><label>Dài (m)<input id="a4" type="number" step="0.01" value="3"></label><label>Rộng (m)<input id="a5" type="number" step="0.01" value="1.6"></label><label>Dày (cm)<input id="a6" type="number" value="2"></label><label>Giá vốn/m²<input id="a7" type="number" value="600000"></label></div><p><button class="p" onclick="addSlabs()">Nhập kho</button></p></div>`},
ban(){const op=D.slabs.filter(s=>s.rem>0.0001);return`<div class="c"><h3 style="margin-top:0">Báo giá / bán theo diện tích cắt</h3><div class="f"><label>Chọn tấm<select id="b1">${op.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} – ${esc(s.type)} (${m2(s.rem)})</option>`).join('')}</select></label><label>Khách / công trình<input id="b2"></label><label>Diện tích cắt (m²)<input id="b3" type="number" step="0.01" oninput="pv()"></label><label>Đơn giá bán/m²<input id="b4" type="number" oninput="pv()"></label><label>Phí gia công<input id="b5" type="number" value="0" oninput="pv()"></label><label>Phí vận chuyển/thi công<input id="b6" type="number" value="0" oninput="pv()"></label><label>Đặt cọc<input id="b7" type="number" value="0"></label></div><h2 id="pvt">Tổng: 0 ₫</h2><button class="p" onclick="sell()">Tạo đơn &amp; trừ kho</button></div>`},
don(){return`<div class="c w"><table><tr><th>Đơn</th><th>Khách</th><th>Tấm</th><th>Tổng</th><th>Còn nợ</th><th>Tiến độ</th><th></th></tr>${[...D.orders].sort((a,b)=>b.date>a.date?1:-1).map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.cust)}</td><td>${esc(o.slab)} · ${m2(o.area)}</td><td>${vnd(o.total)}</td><td>${vnd(debt(o))}</td><td><span class="t">${STEPS[o.step]}</span></td><td>${o.step<5?`<button onclick="adv('${o.id}')">Chuyển bước ›</button> `:''}${debt(o)>0?`<button onclick="pay('${o.id}')">Thu tiền</button> `:''}<button onclick="pq('${o.id}')">In báo giá</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">Chưa có đơn.</td></tr>'}</table></div>`},
nhatky(){return`<p class="mu">Nhật ký do máy chủ ghi thời gian và Rules cấm sửa/xóa.</p><div class="c w"><table><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Chi tiết</th></tr>${D.audit.map(x=>`<tr><td>${x.t?.toDate?x.t.toDate().toLocaleString('vi-VN'):'…'}</td><td>${esc(x.u)}</td><td>${esc(x.a)}</td><td>${esc(x.d)}</td></tr>`).join('')}</table></div>`},
qt(){return`<div class="c w"><h3 style="margin-top:0">👑 Người dùng &amp; phân quyền</h3><table><tr><th>Email</th><th>Vai trò</th><th></th></tr>${D.users.map(u=>`<tr><td>${esc(u.email)}</td><td><select onchange="setRole('${u.id}',this.value)">${Object.keys(PERM).map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td><td><button class="d" onclick="du('${u.id}')">Thu hồi quyền</button></td></tr>`).join('')}</table>
<h4>Cấp tài khoản mới</h4><div class="f"><label>Email<input id="n1" type="email"></label><label>Vai trò<select id="n2"><option value="staff">staff</option><option value="manager">manager</option><option value="admin">admin</option></select></label><label>Mật khẩu tạm (≥10)<input id="n3" type="password"></label></div><p><button class="p" onclick="au()">Tạo</button></p><p class="mu">Thu hồi quyền = xóa hồ sơ phân quyền, tài khoản mất mọi truy cập. Xóa hẳn tài khoản: Firebase Console → Authentication.</p></div>`},
cf(){return`<div class="c"><h3 style="margin-top:0">Firestore Security Rules</h3><p class="mu">Dán vào Firebase Console → Firestore Database → Rules → Publish. Đây là lớp bảo mật thật chạy trên máy chủ Google.</p><textarea rows="14" style="width:100%" readonly>${esc(RULES)}</textarea><p class="mu">Project: <b>${esc(cfg.projectId)}</b></p></div>`}};
/* ---- nghiệp vụ ---- */
Object.assign(window,{render,tab:0,q:0,saveFb,resetFb,login,setupAdmin,lockNow,$,addSlabs,pv,sell,adv,pay,pq,setRole,du,au});
Object.defineProperty(window,'tab',{get:()=>tab,set:v=>tab=v});Object.defineProperty(window,'q',{get:()=>q,set:v=>q=v});
async function addSlabs(){if(!can('nhap'))return;const v=i=>g$('a'+i),n=+v(3),l=+v(4),w=+v(5),c=+v(7);if(!v(1)||!v(2)||!(n>0)||!(l>0)||!(w>0)||!(c>=0))return alert('Nhập đủ và đúng.');
const b=D.slabs.filter(s=>s.lot==v(1)).length,bt=F.writeBatch(db);for(let i=1;i<=n;i++)bt.set(dc('slabs',v(1).replace(/\//g,'-')+'-'+String(b+i).padStart(3,'0')),{lot:v(1),type:v(2),l,w,th:+v(6),area:+(l*w).toFixed(3),rem:+(l*w).toFixed(3),cost:c});
try{await bt.commit();log('NHẬP KHO',`${n} tấm ${v(2)} lô ${v(1)}`);tab='kho';render()}catch(e){alert('Lỗi: '+e.code)}}
function pv(){const g=i=>+$('#b'+i).value||0;$('#pvt').textContent='Tổng: '+vnd(g(3)*g(4)+g(5)+g(6))}
async function sell(){const g=i=>$('#b'+i).value,id=g(1),a=+g(3),p=+g(4),cust=g(2).trim();if(!id||!cust||!(a>0)||!(p>0))return alert('Nhập đủ khách, diện tích, đơn giá.');
const total=a*p+(+g(5)||0)+(+g(6)||0),dep=Math.min(+g(7)||0,total),oid='DH'+Date.now().toString(36).toUpperCase();
try{await F.runTransaction(db,async t=>{const r=dc('slabs',id),s=await t.get(r);if(!s.exists()||s.data().rem<a-1e-6)throw Error('Vượt phần còn lại của tấm');t.update(r,{rem:+(s.data().rem-a).toFixed(3)});t.set(dc('orders',oid),{cust,slab:id,area:a,price:p,fee:+g(5)||0,ship:+g(6)||0,total,paid:dep?[dep]:[],step:0,date:new Date().toISOString(),by:me.uid})});
log('BÁN HÀNG',`${oid} · ${id} · ${a}m² · ${vnd(total)}`);tab='don';render()}catch(e){alert(e.message)}}
async function adv(id){const o=D.orders.find(x=>x.id==id);await F.updateDoc(dc('orders',id),{step:o.step+1});log('TIẾN ĐỘ',`${id} → ${STEPS[o.step+1]}`)}
async function pay(id){const o=D.orders.find(x=>x.id==id),v=+prompt('Số tiền thu (nợ '+vnd(debt(o))+'):');if(!(v>0)||v>debt(o))return;await F.updateDoc(dc('orders',id),{paid:[...(o.paid||[]),v]});log('THU TIỀN',`${id} · ${vnd(v)}`)}
function pq(id){const o=D.orders.find(x=>x.id==id),s=D.slabs.find(x=>x.id==o.slab);$('#q').innerHTML=`<h2>BÁO GIÁ ${esc(o.id)}</h2><p>Khách: ${esc(o.cust)}<br>Ngày: ${new Date(o.date).toLocaleDateString('vi-VN')}</p><table border=1 cellpadding=6 style="border-collapse:collapse;width:100%"><tr><td>Đá ${esc(s?.type)} (${esc(o.slab)}, dày ${s?.th}cm)</td><td>${m2(o.area)} × ${vnd(o.price)}</td></tr><tr><td>Gia công</td><td>${vnd(o.fee)}</td></tr><tr><td>Vận chuyển/thi công</td><td>${vnd(o.ship)}</td></tr><tr><td><b>Tổng</b></td><td><b>${vnd(o.total)}</b></td></tr><tr><td>Còn lại</td><td>${vnd(debt(o))}</td></tr></table>`;print()}
async function setRole(id,r){if(id==me.uid&&r!='admin'&&!confirm('Bạn sắp tự hạ quyền Admin của mình. Tiếp tục?'))return render();await F.updateDoc(dc('users',id),{role:r});log('PHÂN QUYỀN',id+' → '+r)}
async function du(id){if(id==me.uid)return alert('Không thể tự thu hồi quyền.');if(!confirm('Thu hồi quyền người này?'))return;await F.deleteDoc(dc('users',id));log('THU HỒI',id)}
async function au(){const e=g$('n1'),p=$('#n3').value,r=$('#n2').value;if(!e||p.length<10)return alert('Cần email và mật khẩu ≥ 10 ký tự.');
const a2=A.initializeApp(cfg,'sec'+Date.now()),au2=AU.getAuth(a2);try{const c=await AU.createUserWithEmailAndPassword(au2,e,p);await F.setDoc(dc('users',c.user.uid),{email:e,role:r});await AU.signOut(au2);log('TẠO TÀI KHOẢN',e+' ('+r+')');alert('Đã tạo. Hãy báo mật khẩu tạm cho người dùng.')}catch(x){alert('Lỗi: '+(x.code||x.message))}}
cfg=JSON.parse(ls.get('sv_fb')||'null');boot();
</script></body></html>
